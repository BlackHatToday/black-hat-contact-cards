<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<!--
  ============================================================
  DO NOT EDIT THIS FILE PER PERSON.
  This is the same skeleton for everyone — all personal info
  lives in data.json next to it, and all logic/design lives in
  the shared /assets/ files. To add a new person: copy this
  exact file into their folder, unchanged, plus their own
  data.json and photo.
  ============================================================
-->

<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="page">

  <div class="hero">
    <div class="signal">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <img id="avatarImg" class="avatar" style="display:none;" alt="">
      <div id="avatarFallback" class="avatar-fallback"></div>
    </div>
    <h1 class="name" id="nameEl"></h1>
    <p class="tagline" id="taglineEl" style="display:none;"></p>
    <p class="role" id="roleEl"></p>
  </div>

  <section class="about" id="aboutSection" style="display:none;">
    <div class="section-label"><span>About</span></div>
    <p id="aboutText"></p>
  </section>

  <section id="experienceSection" style="display:none;">
    <div class="section-label"><span>Experience</span></div>
    <div class="timeline" id="timelineEl"></div>
  </section>

  <section id="skillsSection" style="display:none;">
    <div class="section-label"><span>Skills</span></div>
    <div class="skills" id="skillsEl"></div>
  </section>

  <section id="socialSection" style="display:none;">
    <div class="section-label"><span>Follow</span></div>
    <div class="social-row" id="socialEl"></div>
  </section>

  <section id="paymentsSection" style="display:none;">
    <div class="section-label"><span>Pay Me</span></div>
    <div id="paymentsEl"></div>
  </section>

  <section id="notesSection" style="display:none;">
    <div class="section-label"><span>Note</span></div>
    <div class="notes" id="notesEl"></div>
  </section>

  <section id="qrSection" style="display:none;">
    <div class="section-label"><span>Scan</span></div>
    <div class="qr-block">
      <div id="qrcode"></div>
      <div class="text">
        <div class="label">Share this page</div>
        <div class="caption">Point a camera here to open this profile on another phone.</div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-label"><span>Contact</span></div>
    <div class="fields" id="fieldsEl"></div>
    <a class="book-btn" id="bookBtn" style="display:none;" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      Book a Time
    </a>
  </section>

  <div style="padding: 0 28px;">
    <button class="save-btn" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
        <path d="M17 21v-8H7v8"/>
        <path d="M7 3v5h8"/>
      </svg>
      Save Contact
    </button>
    <button type="button" class="book-btn" id="shareBackBtn" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/>
      </svg>
      <span id="shareBackLabel">Share Your Info</span>
    </button>
  </div>
  <p class="status" id="statusEl"></p>

  <footer>Tap · Connect · Build</footer>
</div>

<div class="qr-modal-overlay" id="qrModalOverlay">
  <div class="qr-modal">
    <div class="qr-modal-qr" id="qrModalCode"></div>
    <p class="qr-modal-label" id="qrModalLabel"></p>
    <button type="button" class="qr-modal-close" id="qrModalClose">Close</button>
  </div>
</div>

<script src="/assets/app.js"></script>

</body>
</html>
