<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jane Doe — Contact</title>

<!--
  ============================================================
  HOW TO REUSE THIS FOR EACH PERSON
  ============================================================
  1. Edit the CARD_DATA object in the <script> near the bottom.
  2. Replace the photo URL (or remove PHOTO entirely for initials).
  3. Save as a new file / deploy to its own URL per person
     (e.g. yoursite.com/jane, yoursite.com/sam).
  4. Write that URL to the NFC tag.
  Everything else on the page is driven by CARD_DATA — no other
  edits needed for a standard reuse.
  ============================================================
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:        #14171c;
    --surface:    #1c2129;
    --surface-2:  #242a34;
    --copper:     #b8763f;
    --copper-soft:#8a5a30;
    --parchment:  #ede6d6;
    --muted:      #8b93a1;
    --line:       #2e3542;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    min-height:100%;
    background:
      radial-gradient(circle at 50% 0%, #1a1f27 0%, var(--ink) 55%);
    color:var(--parchment);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:380px;
    position:relative;
  }

  /* ---- signal / ripple signature ---- */
  .signal{
    position:relative;
    width:132px;
    height:132px;
    margin:0 auto 28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--copper);
    opacity:0;
  }

  @keyframes pulse{
    0%   { transform:scale(0.4); opacity:0; }
    12%  { opacity:0.55; }
    100% { transform:scale(1.9); opacity:0; }
  }

  .ring{ animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) 1; }
  .ring:nth-child(1){ width:132px; height:132px; animation-delay:.15s; }
  .ring:nth-child(2){ width:132px; height:132px; animation-delay:.65s; }
  .ring:nth-child(3){ width:132px; height:132px; animation-delay:1.15s; }

  .avatar{
    position:relative;
    z-index:2;
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--copper);
    background:var(--surface-2);
  }

  .avatar-fallback{
    position:relative;
    z-index:2;
    width:96px;
    height:96px;
    border-radius:50%;
    border:2px solid var(--copper);
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:32px;
    color:var(--copper);
    letter-spacing:0.02em;
  }

  /* ---- identity ---- */
  .name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1.15;
    text-align:center;
    letter-spacing:-0.01em;
  }

  .role{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    margin-top:6px;
  }

  .role .org{ color:var(--copper); }

  /* ---- divider ---- */
  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    margin:32px 0 14px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .eyebrow span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---- data rows (styled like a spec sheet, echoing the chip) ---- */
  .fields{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }

  .field{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    text-decoration:none;
    color:inherit;
    border-bottom:1px solid var(--line);
    transition:background .15s ease;
  }
  .field:last-child{ border-bottom:none; }
  .field:hover{ background:var(--surface-2); }

  .field .icon{
    width:18px;
    flex-shrink:0;
    color:var(--copper);
  }

  .field .meta{ min-width:0; }

  .field .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:2px;
  }

  .field .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:14.5px;
    color:var(--parchment);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---- save button ---- */
  .save-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    margin-top:22px;
    padding:16px 20px;
    background:var(--copper);
    color:var(--ink);
    border:none;
    border-radius:14px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.01em;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .save-btn:hover{ background:#c98549; }
  .save-btn:active{ transform:scale(0.98); }

  .save-btn svg{ width:19px; height:19px; }

  .status{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:12px;
    min-height:16px;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#525a68;
  }

  @media (prefers-reduced-motion: reduce){
    .ring{ animation:none; opacity:0; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="signal">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <img id="avatarImg" class="avatar" style="display:none;" alt="">
    <div id="avatarFallback" class="avatar-fallback"></div>
  </div>

  <h1 class="name" id="nameEl"></h1>
  <p class="role" id="roleEl"></p>

  <div class="eyebrow"><span>Contact</span></div>

  <div class="fields" id="fieldsEl"></div>

  <button class="save-btn" id="saveBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
      <path d="M17 21v-8H7v8"/>
      <path d="M7 3v5h8"/>
    </svg>
    Save Contact
  </button>
  <p class="status" id="statusEl"></p>

  <footer>Tap · Connect</footer>
</div>

<script>
  /* ============================================================
     EDIT THIS BLOCK PER PERSON — everything else reads from it
     ============================================================ */
  const CARD_DATA = {
    firstName: "Jane",
    lastName:  "Doe",
    org:       "Acme Co",
    title:     "Marketing Director",
    phone:     "+1-555-123-4567",
    email:     "jane@acme.com",
    website:   "https://acme.com",
    // Leave photoUrl empty ("") to show initials instead of a photo.
    photoUrl:  ""
  };
  /* ============================================================ */

  const fullName = `${CARD_DATA.firstName} ${CARD_DATA.lastName}`.trim();
  document.title = `${fullName} — Contact`;
  document.getElementById('nameEl').textContent = fullName;

  const roleParts = [];
  if (CARD_DATA.title) roleParts.push(CARD_DATA.title);
  const roleEl = document.getElementById('roleEl');
  if (CARD_DATA.title && CARD_DATA.org){
    roleEl.innerHTML = `${CARD_DATA.title} · <span class="org">${CARD_DATA.org}</span>`;
  } else if (CARD_DATA.org){
    roleEl.innerHTML = `<span class="org">${CARD_DATA.org}</span>`;
  } else {
    roleEl.textContent = CARD_DATA.title || '';
  }

  // Avatar or initials fallback
  const initials = (CARD_DATA.firstName[0] || '') + (CARD_DATA.lastName[0] || '');
  const avatarImg = document.getElementById('avatarImg');
  const avatarFallback = document.getElementById('avatarFallback');
  if (CARD_DATA.photoUrl){
    avatarImg.src = CARD_DATA.photoUrl;
    avatarImg.alt = fullName;
    avatarImg.style.display = 'block';
    avatarFallback.style.display = 'none';
  } else {
    avatarFallback.textContent = initials.toUpperCase();
  }

  // Icons for each field type
  const ICONS = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>',
    website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>'
  };

  const fields = [];
  if (CARD_DATA.phone)   fields.push({ key:'phone',   label:'Phone',   value: CARD_DATA.phone,   href:`tel:${CARD_DATA.phone.replace(/[^+\d]/g,'')}` });
  if (CARD_DATA.email)   fields.push({ key:'email',   label:'Email',   value: CARD_DATA.email,   href:`mailto:${CARD_DATA.email}` });
  if (CARD_DATA.website) fields.push({ key:'website', label:'Website', value: CARD_DATA.website.replace(/^https?:\/\//,''), href: CARD_DATA.website });

  const fieldsEl = document.getElementById('fieldsEl');
  fieldsEl.innerHTML = fields.map(f => `
    <a class="field" href="${f.href}" target="_blank" rel="noopener">
      <span class="icon">${ICONS[f.key]}</span>
      <span class="meta">
        <div class="label">${f.label}</div>
        <div class="value">${f.value}</div>
      </span>
    </a>
  `).join('');

  // Build and download the vCard
  function buildVCard(d){
    const lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      `N:${d.lastName};${d.firstName};;;`,
      `FN:${d.firstName} ${d.lastName}`,
    ];
    if (d.org) lines.push(`ORG:${d.org}`);
    if (d.title) lines.push(`TITLE:${d.title}`);
    if (d.phone) lines.push(`TEL;TYPE=CELL:${d.phone}`);
    if (d.email) lines.push(`EMAIL:${d.email}`);
    if (d.website) lines.push(`URL:${d.website}`);
    if (d.photoUrl) lines.push(`PHOTO;VALUE=URL:${d.photoUrl}`);
    lines.push('END:VCARD');
    return lines.join('\r\n');
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const vcard = buildVCard(CARD_DATA);
    const blob = new Blob([vcard], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${CARD_DATA.firstName}_${CARD_DATA.lastName}.vcf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    document.getElementById('statusEl').textContent = 'Contact file downloaded — open it to save.';
  });
</script>

</body>
</html>
