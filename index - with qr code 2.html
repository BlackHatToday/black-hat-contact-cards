<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<!--
  ============================================================
  HOW TO REUSE THIS FOR EACH PERSON
  ============================================================
  1. Edit PROFILE_DATA in the <script> near the bottom.
  2. Put a photo named to match PHOTO_FILE next to this file,
     or change PHOTO_FILE to a full URL.
  3. skills[] and social{} fields are all optional — leave a
     social handle blank ("") and that row just doesn't render.
  4. Set contactUrl to this page's own live URL to generate a
     working QR code (useful for print materials or a poster
     next to a laptop, alongside the NFC tag).
  5. Save as a new file per person and deploy to its own URL.
  ============================================================
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:        #14171c;
    --surface:    #1c2129;
    --surface-2:  #242a34;
    --copper:     #b8763f;
    --copper-soft:#c98549;
    --parchment:  #ede6d6;
    --muted:      #8b93a1;
    --line:       #2e3542;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    background: radial-gradient(circle at 50% 0%, #1a1f27 0%, var(--ink) 60%);
    color: var(--parchment);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{ display:flex; justify-content:center; padding: 0 0 60px; }

  .page{ width:100%; max-width: 560px; }

  /* ---- hero ---- */
  .hero{
    padding: 52px 28px 34px;
    text-align:center;
    position:relative;
  }

  .signal{
    position:relative;
    width:132px; height:132px;
    margin:0 auto 22px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{ position:absolute; border-radius:50%; border:1px solid var(--copper); opacity:0; }
  @keyframes pulse{
    0%   { transform:scale(0.4); opacity:0; }
    12%  { opacity:0.55; }
    100% { transform:scale(1.9); opacity:0; }
  }
  .ring{ animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) 1; }
  .ring:nth-child(1){ width:132px; height:132px; animation-delay:.15s; }
  .ring:nth-child(2){ width:132px; height:132px; animation-delay:.65s; }
  .ring:nth-child(3){ width:132px; height:132px; animation-delay:1.15s; }

  .avatar{
    position:relative; z-index:2;
    width:96px; height:96px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--copper);
  }
  .avatar-fallback{
    position:relative; z-index:2;
    width:96px; height:96px;
    border-radius:50%;
    border:2px solid var(--copper);
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:32px;
    color:var(--copper);
  }

  .name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:-0.01em;
  }

  .tagline{
    color: var(--copper-soft);
    font-size: 15px;
    margin-top: 8px;
    font-family:'IBM Plex Mono', monospace;
  }

  .role{
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }
  .role .org{ color: var(--parchment); }

  /* ---- section shell ---- */
  section{ padding: 0 28px; margin-top: 8px; }

  .section-label{
    display:flex; align-items:center; gap:10px;
    margin: 34px 0 14px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--line); }
  .section-label span{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--copper);
  }

  /* ---- about / narrative ---- */
  .about p{
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--parchment);
  }

  /* ---- QR code block ---- */
  .qr-block{
    display:flex;
    align-items:center;
    gap: 20px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    flex-wrap: wrap;
  }
  #qrcode{
    flex-shrink:0;
    width: clamp(72px, 22vw, 92px);
    height: clamp(72px, 22vw, 92px);
    background: var(--parchment);
    border-radius: 8px;
    padding: 7px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #qrcode canvas, #qrcode img{
    display:block;
    width:100% !important;
    height:100% !important;
    max-width:100%;
  }
  .qr-block .text{ min-width:0; }
  .qr-block .label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .qr-block .caption{
    font-size: 12.5px;
    color: var(--parchment);
    line-height: 1.5;
  }

  /* ---- skills ---- */
  .skills{ display:flex; flex-wrap:wrap; gap: 8px; }
  .skill-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--parchment);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 7px 13px;
    border-radius: 999px;
  }

  /* ---- social ---- */
  .social-row{ display:flex; flex-wrap:wrap; gap: 10px; }
  .social-pill{
    display:flex; align-items:center; gap:7px;
    padding:9px 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    text-decoration:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--parchment);
    transition:border-color .15s ease, background .15s ease;
  }
  .social-pill:hover{ border-color:var(--copper); background:var(--surface-2); }
  .social-pill svg{ width:15px; height:15px; color:var(--copper); }
  .social-pill span{ font-weight:500; }

  /* ---- contact fields ---- */
  .fields{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .field{
    display:flex; align-items:center; gap:14px;
    padding:13px 18px;
    text-decoration:none; color:inherit;
    border-bottom:1px solid var(--line);
    transition:background .15s ease;
  }
  .field:last-child{ border-bottom:none; }
  .field:hover{ background:var(--surface-2); }
  .field .icon{ width:17px; flex-shrink:0; color:var(--copper); }
  .field .meta{ min-width:0; flex:1; }
  .field .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:2px;
  }
  .field .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; color:var(--parchment);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---- save button ---- */
  .save-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%;
    margin-top: 30px;
    padding:16px 20px;
    background:var(--copper);
    color:var(--ink);
    border:none; border-radius:14px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:16px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .save-btn:hover{ background:#c98549; }
  .save-btn:active{ transform:scale(0.98); }
  .save-btn svg{ width:19px; height:19px; }

  .status{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:12px;
    padding: 0 28px;
    min-height:16px;
  }

  footer{
    text-align:center;
    margin-top: 44px;
    padding: 0 28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:#525a68;
  }

  @media (prefers-reduced-motion: reduce){ .ring{ animation:none; opacity:0; } }
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <div class="signal">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <img id="avatarImg" class="avatar" style="display:none;" alt="">
      <div id="avatarFallback" class="avatar-fallback"></div>
    </div>
    <h1 class="name" id="nameEl"></h1>
    <p class="tagline" id="taglineEl" style="display:none;"></p>
    <p class="role" id="roleEl"></p>
  </div>

  <section class="about" id="aboutSection" style="display:none;">
    <div class="section-label"><span>About</span></div>
    <p id="aboutText"></p>
  </section>

  <section id="skillsSection" style="display:none;">
    <div class="section-label"><span>Skills</span></div>
    <div class="skills" id="skillsEl"></div>
  </section>

  <section id="socialSection" style="display:none;">
    <div class="section-label"><span>Follow</span></div>
    <div class="social-row" id="socialEl"></div>
  </section>

  <section id="qrSection" style="display:none;">
    <div class="section-label"><span>Scan</span></div>
    <div class="qr-block">
      <div id="qrcode"></div>
      <div class="text">
        <div class="label">Share this page</div>
        <div class="caption">Point a camera here to open this profile on another phone.</div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-label"><span>Contact</span></div>
    <div class="fields" id="fieldsEl"></div>
  </section>

  <div style="padding: 0 28px;">
    <button class="save-btn" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
        <path d="M17 21v-8H7v8"/>
        <path d="M7 3v5h8"/>
      </svg>
      Save Contact
    </button>
  </div>
  <p class="status" id="statusEl"></p>

  <footer>Tap · Connect</footer>
</div>

<script>
  /* ============================================================
     EDIT THIS BLOCK PER PERSON — every section is optional
     except name; leave an array empty to hide that section.
     ============================================================ */
  const PROFILE_DATA = {
    firstName: "Jane",
    lastName:  "Doe",
    title:     "Marketing Director",
    org:       "Acme Co",
    tagline:   "Brand strategy · Storytelling · Growth",
    // about, skills, social, and contactUrl below are all optional —

    about: "I help growing companies find their voice and build marketing that actually sounds like them. Fifteen years in brand strategy, half of it spent convincing people that the boring stuff (positioning, messaging hierarchy) is what makes the fun stuff (campaigns, launches) actually work.",

    skills: ["Brand Strategy", "Positioning", "Content Strategy", "Team Leadership", "Public Speaking"],

    // Leave any handle as "" to hide that row. Just the @handle or
    // page name is enough — full URLs are built automatically below.
    social: {
      instagram: "janedoe",
      tiktok:    "janedoe",
      facebook:  "jane.doe"
    },

    phones: [
      { type: "Mobile", number: "+1-555-123-4567" }
    ],
    emails: [
      { type: "Email", address: "jane@acme.com" }
    ],
    website: "https://acme.com",

    // This page's own live URL, once deployed — used to generate the
    // QR code below. Leave "" to hide the QR section entirely.
    contactUrl: "https://black-hat-contact-cards.vercel.app/jane-doe/"
  };

  const PHOTO_FILE = "photo.jpg";
  /* ============================================================ */

  const fullName = `${PROFILE_DATA.firstName} ${PROFILE_DATA.lastName}`.trim();
  document.title = `${fullName} — Profile`;
  document.getElementById('nameEl').textContent = fullName;

  if (PROFILE_DATA.tagline){
    const t = document.getElementById('taglineEl');
    t.textContent = PROFILE_DATA.tagline;
    t.style.display = 'block';
  }

  const roleEl = document.getElementById('roleEl');
  if (PROFILE_DATA.title && PROFILE_DATA.org){
    roleEl.innerHTML = `${PROFILE_DATA.title} · <span class="org">${PROFILE_DATA.org}</span>`;
  } else if (PROFILE_DATA.org){
    roleEl.innerHTML = `<span class="org">${PROFILE_DATA.org}</span>`;
  } else {
    roleEl.textContent = PROFILE_DATA.title || '';
  }

  // Avatar (trailing-slash-safe path)
  const initials = (PROFILE_DATA.firstName[0] || '') + (PROFILE_DATA.lastName[0] || '');
  const avatarImg = document.getElementById('avatarImg');
  const avatarFallback = document.getElementById('avatarFallback');
  if (PHOTO_FILE){
    const isFullUrl = /^https?:\/\//i.test(PHOTO_FILE);
    const basePath = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
    avatarImg.src = isFullUrl ? PHOTO_FILE : basePath + PHOTO_FILE;
    avatarImg.alt = fullName;
    avatarImg.style.display = 'block';
    avatarFallback.style.display = 'none';
    avatarImg.onerror = () => { avatarImg.style.display='none'; avatarFallback.style.display='flex'; avatarFallback.textContent = initials.toUpperCase(); };
  } else {
    avatarFallback.textContent = initials.toUpperCase();
  }

  // About
  if (PROFILE_DATA.about){
    document.getElementById('aboutText').textContent = PROFILE_DATA.about;
    document.getElementById('aboutSection').style.display = 'block';
  }

  // QR code — only shown if a contact URL is set
  if (PROFILE_DATA.contactUrl){
    document.getElementById('qrSection').style.display = 'block';
    new QRCode(document.getElementById("qrcode"), {
      text: PROFILE_DATA.contactUrl,
      width: 180,
      height: 180,
      colorDark: "#14171c",
      colorLight: "#ede6d6",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // Skills
  if (PROFILE_DATA.skills && PROFILE_DATA.skills.length){
    document.getElementById('skillsEl').innerHTML = PROFILE_DATA.skills.map(s => `<span class="skill-pill">${s}</span>`).join('');
    document.getElementById('skillsSection').style.display = 'block';
  }

  // Social — Instagram, TikTok, Facebook, each with its own icon and
  // auto-built URL from just a handle/page name.
  const SOCIAL_PLATFORMS = {
    instagram: {
      label: 'Instagram',
      urlFor: h => `https://instagram.com/${h.replace(/^@/, '')}`,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'
    },
    tiktok: {
      label: 'TikTok',
      urlFor: h => `https://tiktok.com/@${h.replace(/^@/, '')}`,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18a4 4 0 1 0 4-4V2"/><path d="M13 6a5 5 0 0 0 5 5"/></svg>'
    },
    facebook: {
      label: 'Facebook',
      urlFor: h => `https://facebook.com/${h.replace(/^@/, '')}`,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>'
    }
  };

  const socialEntries = Object.entries(PROFILE_DATA.social || {})
    .filter(([, handle]) => handle && handle.trim())
    .map(([platform, handle]) => ({ ...SOCIAL_PLATFORMS[platform], url: SOCIAL_PLATFORMS[platform].urlFor(handle) }));

  if (socialEntries.length){
    document.getElementById('socialEl').innerHTML = socialEntries.map(s => `
      <a class="social-pill" href="${s.url}" target="_blank" rel="noopener">${s.icon}<span>${s.label}</span></a>
    `).join('');
    document.getElementById('socialSection').style.display = 'block';
  }

  // Contact fields
  const ICONS = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>',
    website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>'
  };
  const rows = [];
  (PROFILE_DATA.phones || []).forEach(p => rows.push({ icon:'phone', label:p.type||'Phone', value:p.number, href:`tel:${p.number.replace(/[^+\d]/g,'')}` }));
  (PROFILE_DATA.emails || []).forEach(e => rows.push({ icon:'email', label:e.type||'Email', value:e.address, href:`mailto:${e.address}` }));
  if (PROFILE_DATA.website) rows.push({ icon:'website', label:'Website', value:PROFILE_DATA.website.replace(/^https?:\/\//,''), href:PROFILE_DATA.website });
  document.getElementById('fieldsEl').innerHTML = rows.map(r => `
    <a class="field" href="${r.href}" target="_blank" rel="noopener">
      <span class="icon">${ICONS[r.icon]}</span>
      <span class="meta"><div class="label">${r.label}</div><div class="value">${r.value}</div></span>
    </a>
  `).join('');

  // vCard save
  function buildVCard(d){
    const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${d.lastName};${d.firstName};;;`, `FN:${d.firstName} ${d.lastName}`];
    if (d.org) lines.push(`ORG:${d.org}`);
    if (d.title) lines.push(`TITLE:${d.title}`);
    (d.phones || []).forEach(p => lines.push(`TEL;TYPE=${(p.type||'CELL').toUpperCase()}:${p.number}`));
    (d.emails || []).forEach(e => lines.push(`EMAIL:${e.address}`));
    if (d.website) lines.push(`URL:${d.website}`);
    lines.push('END:VCARD');
    return lines.join('\r\n');
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const vcard = buildVCard(PROFILE_DATA);
    const blob = new Blob([vcard], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${PROFILE_DATA.firstName}_${PROFILE_DATA.lastName}.vcf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    document.getElementById('statusEl').textContent = 'Contact file downloaded — open it to save.';
  });
</script>

</body>
</html>
