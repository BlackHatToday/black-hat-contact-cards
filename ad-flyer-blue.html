<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hat Community — 4x6 Ad Flyer (Blue)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --navy:#16283f; --navy-2:#1e3a5a;
    --blue-bright:#6db1ea; --blue-soft:#a9cdec;
    --off-white:#f6f3ea; --off-white-2:#ece7d8;
    --ink-text:#16283f; --muted:#7c8794;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:#d7dade; font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  body{ display:flex; flex-direction:column; align-items:center; padding:30px 16px; }

  .flyer{
    width:384px; height:576px;
    background:var(--off-white);
    border-radius:2px; overflow:hidden; position:relative;
    display:flex; flex-direction:column;
    box-shadow:0 8px 30px rgba(22,40,63,0.22);
  }

  /* ---- hero: the signature illustration carries this flyer ---- */
  .hero{
    height:38%; flex-shrink:0; position:relative; overflow:hidden;
    background:radial-gradient(circle at 50% 20%, var(--navy-2) 0%, var(--navy) 70%);
    display:flex; align-items:center; justify-content:center;
  }
  .signal-art{ width:168px; height:168px; }

  .body-area{ padding:26px 26px 8px; flex:1; display:flex; flex-direction:column; }
  .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--blue-bright); text-align:center; margin-bottom:10px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:26px;
    line-height:1.22; text-align:center; color:var(--ink-text); letter-spacing:-0.01em;
  }
  .price-line{
    text-align:center; font-family:'IBM Plex Sans', sans-serif; font-weight:500;
    font-size:16px; color:var(--navy-2); margin-top:14px;
  }
  .price-line b{ font-weight:700; color:var(--navy); font-family:'Space Grotesk', sans-serif; }
  .tagline{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-weight:500;
    font-size:12px; letter-spacing:0.08em; color:var(--muted); margin-top:auto; padding-top:20px;
  }

  .bottom-area{ display:flex; flex-direction:column; align-items:center; padding:18px 20px 24px; }
  .qr-block{
    background:var(--navy); border-radius:6px; padding:10px;
    width:100px; height:100px; display:flex; align-items:center; justify-content:center;
  }
  .qr-block canvas, .qr-block img{ width:100% !important; height:100% !important; display:block; }
  .qr-caption{
    font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:0.04em;
    color:var(--muted); text-align:center; margin-top:7px;
  }

  .print-hint{ text-align:center; color:#5c6672; font-size:12px; margin-top:16px; font-family:'IBM Plex Mono', monospace; }

  @media print{
    html, body{ background:#fff; padding:0; }
    .print-hint{ display:none; }
    .flyer{ width:4in; height:6in; box-shadow:none; margin:0;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page{ size:4in 6in; margin:0; }
  }
</style>
</head>
<body>

<div class="flyer">
  <div class="hero">
    <svg class="signal-art" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- phone, upright, center-right -->
      <g transform="translate(84,30)">
        <rect x="0" y="0" width="72" height="146" rx="16" stroke="var(--off-white)" stroke-width="3.5" fill="var(--off-white)" fill-opacity="0.08"/>
        <rect x="10" y="12" width="52" height="112" rx="4" fill="var(--off-white)" fill-opacity="0.14"/>
        <rect x="26" y="8" width="20" height="6" rx="3" fill="var(--off-white)" fill-opacity="0.6"/>
        <rect x="26" y="130" width="20" height="4" rx="2" fill="var(--off-white)" fill-opacity="0.6"/>
      </g>
      <!-- card, tapped to upper-back of phone, tilted -->
      <g transform="translate(24,52) rotate(-18)">
        <rect x="0" y="0" width="62" height="40" rx="6" stroke="var(--off-white)" stroke-width="3" fill="var(--off-white)" fill-opacity="0.9"/>
        <rect x="9" y="10" width="20" height="4" rx="2" fill="var(--navy)" opacity="0.5"/>
        <rect x="9" y="18" width="32" height="3" rx="1.5" fill="var(--navy)" opacity="0.3"/>
        <rect x="9" y="24" width="26" height="3" rx="1.5" fill="var(--navy)" opacity="0.3"/>
      </g>
      <!-- signal rings, radiating clearly from the tap point -->
      <path d="M92 92 A 22 22 0 0 1 118 78" stroke="var(--blue-bright)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M84 104 A 38 38 0 0 1 126 62" stroke="var(--blue-bright)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.65"/>
      <path d="M76 116 A 54 54 0 0 1 134 46" stroke="var(--blue-bright)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35"/>
    </svg>
  </div>

  <div class="body-area">
    <div class="kicker">Black Hat Community</div>
    <h1>Tap to share your contact information.</h1>
    <p class="price-line"><b>$25</b> Personal &middot; <b>$50</b> Business — Unlimited Uses.</p>
    <p class="tagline">TAP &nbsp;·&nbsp; CONNECT &nbsp;·&nbsp; BUILD</p>
  </div>

  <div class="bottom-area">
    <div class="qr-block" id="qrcode"></div>
    <div class="qr-caption">Scan to request yours</div>
  </div>
</div>

<p class="print-hint">Press Ctrl / Cmd + P to print — sized for a 4" × 6" card.</p>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://blackhatcards.community/my-contact-info-form.html",
    width: 180, height: 180,
    colorDark: "#f6f3ea", colorLight: "#16283f",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>

</body>
</html>
